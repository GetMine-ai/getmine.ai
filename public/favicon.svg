      <stop offset="0%" stop-color="#00E5C2" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00E5C2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00E5C2" stop-opacity="0"/>
